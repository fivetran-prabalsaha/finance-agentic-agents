name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.6.0"

      - name: Ruff check
        run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: compliance_user
          POSTGRES_PASSWORD: compliance_pass
          POSTGRES_DB: compliance_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compliance_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://compliance_user:compliance_pass@localhost:5432/compliance_db
      REDIS_URL: redis://localhost:6379/0
      # Use repo secret if set, otherwise fall back to stub (live-API tests are excluded below)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NETSUITE_ACCOUNT_ID: stub
      NETSUITE_CONSUMER_KEY: stub
      NETSUITE_CONSUMER_SECRET: stub
      NETSUITE_TOKEN_KEY: stub
      NETSUITE_TOKEN_SECRET: stub
      OKTA_DOMAIN: stub.okta.com
      OKTA_API_TOKEN: stub
      MCP_API_KEY: dev-key-12345
      JIRA_BASE_URL: https://stub.atlassian.net
      JIRA_EMAIL: stub@stub.com
      JIRA_API_TOKEN: stub
      SLACK_BOT_TOKEN: xoxb-stub
      SLACK_APP_TOKEN: xapp-stub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set stub env vars for missing secrets
        run: |
          echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-ant-stub}" >> $GITHUB_ENV

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply DB schema
        run: |
          psql $DATABASE_URL -f database/schema.sql
          psql $DATABASE_URL -f database/schema_extensions.sql || true

      - name: Run tests
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --ignore=tests/test_end_to_end_stress.py \
            --ignore=tests/test_collection_agent.py \
            --ignore=tests/test_mcp_server.py \
            --ignore=tests/test_restlet_optimization.py \
            --ignore=tests/netsuite \
            -x

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
